[package]
name = "cyd-qr"
version = "0.1.0"
edition = "2021"
description = "QR code display server for the ESP32-2432S028 CYD (bench QR source for gm65-scanner HIL)"
license = "MIT OR Apache-2.0"

[features]
default = ["st7796", "bl27"]
ili9341 = []
st7789 = []
ili9342 = []
st7796 = []
invert = []
bl27 = []
bl_low = []
mirror = []

[dependencies]
esp-hal = { version = "1.1.0", features = ["esp32", "unstable"] }
esp-rtos = { version = "0.3.0", features = ["esp32", "embassy"] }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32"] }
embassy-executor = "0.10"
embedded-hal = "1.0"
embedded-hal-bus = "0.2"
embedded-io-async = "0.7"
static_cell = "1"
embedded-graphics = "0.8"
mipidsi = "0.9"
qrcodegen-no-heap = "1.8"

[profile.release]
debug = true
lto = true
opt-level = "s"
