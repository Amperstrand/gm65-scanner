# CYD QR-display server (xtensa esp32, built with the `esp` rustup toolchain)
#
#   . ~/export-esp.sh && cargo +esp build --release
#
[build]
target = "xtensa-esp32-none-elf"

[target.xtensa-esp32-none-elf]
runner = "espflash flash --chip esp32"
rustflags = ["-C", "link-arg=-Tlinkall.x"]

[unstable]
build-std = ["core"]
